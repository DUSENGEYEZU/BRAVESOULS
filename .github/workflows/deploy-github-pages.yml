# Automatic deploy: every push to master (or main) builds and publishes to gh-pages.
#
# GitHub UI settings (cannot be set from this file — do once in the repo on github.com):
#   Settings → Actions → General → Workflow permissions → Read and write permissions
#     (required so GITHUB_TOKEN can push to gh-pages; default read-only breaks deploy)
#   Settings → Pages → Deploy from branch gh-pages / (root)
# See also: .github/README.md and DEPLOYMENT.md → "GitHub Actions — repository settings"
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build-prod

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/bravesouls/browser
          force_orphan: true
